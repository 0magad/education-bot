# config.yaml — конфигурация бота

# TASK 3.1: Организация
organization:
  name: ${ORGANIZATION_NAME}
  description: ${ORGANIZATION_DESCRIPTION}
  support_contact: ${SUPPORT_CONTACT}
  logo_path: ${LOGO_PATH}

# TASK 3.2: Группы по умолчанию (config имеет приоритет над БД)
groups:
  default:
    - general
    - support
    - managers

# TASK 3.3: Тексты бота с поддержкой подстановки {organization_name}
messages:
  welcome: "Привет, {first_name}! 👋\n\nДобро пожаловать в {organization_name}! Я ваш AI-ассистент.\n\nЯ могу помочь тебе:\n• 📚 Учиться с помощью контекстного AI-репетитора\n• 📅 Планировать свои занятия\n• 📖 Использовать справочник знаний\n\nИспользуй /help для списка команд."
  help: "📋 Доступные команды {organization_name}:\n\n👤 Основные:\n/start - Начать работу с ботом\n/help - Показать это сообщение\n/status - Показать твою информацию (включая User ID)\n\n📅 Расписание:\n/schedule - Показать твое расписание на неделю\n/today - Занятия на сегодня\n\n🤖 AI-репетитор:\nПросто напиши мне вопрос или задачу, и я помогу тебе!"
  unknown: "Не понял запрос. Нажмите /help для списка команд."
  no_group: "Твоя группа ещё не назначена администратором. Обратись к администратору."
  class_removed: "В {organization_name} нет «классов» — используется «группа», которую назначает администратор.\nЕсли у тебя не отображается расписание, обратись к администратору."
  buttons:
    menu: "📋 Меню"
    help: "❓ Помощь"
    contact: "📞 Контакты"
    back: "🔙 Назад"
