# organization.yaml — конфигурация организации
# Этот файл содержит специфичные для вашей организации настройки
# TASK 3.1: Конфиг организации

# Основная информация об организации
organization:
  # Название организации - используется в приветствии бота
  name: "${ORGANIZATION_NAME|Учебное учреждение}"
  
  # Описание организации
  description: "${ORGANIZATION_DESCRIPTION|Образовательное учреждение на базе Telegram-бота}"
  
  # Контакт поддержки (Telegram username или email)
  support_contact: "${SUPPORT_CONTACT|@support}"
  
  # Путь к логотипу (опционально)
  logo_path: "${LOGO_PATH|}"
  
  # Аббревиатура организации (для сокращённого использования)
  abbreviation: "${ORG_ABBREVIATION|ОУ}"
  
  # Регион/местоположение
  region: "${REGION|}"
  
  # Сайт организации
  website: "${WEBSITE|}"

# TASK 3.2: Группы (направления / курсы) организации
# Настройте этот список под вашу организацию — без правки кода
groups:
  # Список групп для отображения в интерфейсе и проверки при загрузке данных
  default:
    - "VR/AR приложения"
    - "3D моделирование"
    - "Инженерная графика"
    - "Основы графического дизайна"
    - "Пайтон для начинающих"
    - "Архитектура и дизайн"
    - "Интеллект-школа. История.9-11 классы"
    - "Интеллект школа. Русский язык. (7-8 классы)"
    - "Концепт-арт: Создание 3D-персонажа"
    - "Основы веб-программирования"

# TASK 3.3: Визуальное оформление и бренд
branding:
  # Цвет бренда (для будущего использования в веб-интерфейсе)
  primary_color: "#1F77E4"
  secondary_color: "#25C6DA"
  
  # Эмодзи организации
  emoji: "🎓"
  
  # Фраза приветствия
  greeting_phrase: "Добро пожаловать в"

# TASK 3.4: Настройки базы данных (для мульти-БД)
database:
  # Путь к основной БД (может быть переопределена в .env)
  path: "${DB_PATH|data/bot.db}"
  
  # Путь к аналитической БД (опционально)
  analytics_path: "${DB_PATH_ANALYTICS|}"
  
  # Создавать резервную копию при запуске
  backup_on_startup: true
  
  # Папка для резервных копий
  backup_dir: "data/backups"

# Настройки AI провайдера (переопределяет .env)
ai:
  # Провайдер: 'ollama', 'groq', 'openai', 'gemini'
  provider: "${AI_PROVIDER|ollama}"
  
  # Модель (для каждого провайдера)
  model: "${AI_MODEL|}"
  
  # Специфичные для провайдера параметры
  ollama:
    base_url: "${OLLAMA_BASE_URL|http://localhost:11434}"
    model: "${OLLAMA_MODEL|llama3.1}"
    
  groq:
    api_key: "${GROQ_API_KEY|}"
    model: "mixtral-8x7b-32768"
  
  openai:
    api_key: "${OPENAI_API_KEY|}"
    model: "gpt-3.5-turbo"
  
  gemini:
    api_key: "${GEMINI_API_KEY|}"
    model: "gemini-1.5-pro"
  
  # Резервный провайдер (на случай ошибки основного)
  fallback_provider: "${FALLBACK_AI_PROVIDER|}"
  
  # Параметры генерации
  generation:
    temperature: 0.7
    max_tokens: 2000
    top_p: 0.9

# Расписание и уведомления
schedule:
  # Интервал проверки расписания (секунды)
  check_interval: 60
  
  # Интервал отправки напоминаний (секунды)
  reminder_interval: 7200  # 2 часа
  
  # За сколько минут до урока отправлять напоминание
  reminder_advance_minutes: 30
  
  # Включить ли массовые рассылки событий
  enable_broadcasts: true
  
  # Время для системных сообщений (HH:MM, 24-часовой формат)
  system_message_time: "08:00"

# Администрирование
admin:
  # Включить ли логирование действий администраторов
  enable_action_logging: true
  
  # Папка для логов
  logs_dir: "data/logs"
  
  # Требовать подтверждение перед массовой рассылкой
  confirm_bulk_actions: true
  
  # Максимальное количество записей при импорте за раз
  import_batch_size: 1000

# Функции бота
features:
  # AI-репетитор
  tutor:
    enabled: true
    context_messages: 10  # Последние N сообщений в контексте
    # Специализация бота — используется в системном промпте (настройте под вашу организацию)
    specialization:
      - "VR/AR приложения"
      - "3D моделирование"
      - "Инженерная графика"
      - "Основы графического дизайна"
      - "Пайтон для начинающих"
      - "Архитектура и дизайн"
      - "Интеллект-школа. История.9-11 классы"
      - "Интеллект школа. Русский язык. (7-8 классы)"
      - "Концепт-арт: Создание 3D-персонажа"
      - "Основы веб-программирования"
    # Параметры повторных попыток при недоступности Ollama (5.4)
    ollama_retries: 2       # Количество повторов
    ollama_retry_delay: 3   # Задержка между попытками (секунды)

  # Планировщик расписания
  scheduler:
    enabled: true

  # Справочник знаний
  reference:
    enabled: true

  # Быстрые кнопки вопросов (5.2) — inline-кнопки под сообщениями AI
  quick_questions:
    enabled: true
    questions:
      - "Объясни тему"
      - "Дай пример"
      - "Проверь решение"

  # Оценка ответов AI (5.2)
  answer_rating:
    enabled: true

# Версия конфига (для миграций)
version: "1.0"
