# Права доступа для групп (опционально)
access_control:
  # Может ли группа видеть расписание других групп
  can_view_other_schedules: false
  
  # Может ли администратор видеть сообщения пользователей
  admin_can_view_messages: true
  
  # Может ли группа использовать AI-репетитор
  can_use_tutor: true

# Шаблон для новой группы
template:
  name: "Новая группа"
  short_name: ""
  teacher: "Не назначен"
  room: "0"
  level: 0
