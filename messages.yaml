# messages.yaml — все текстовые сообщения бота
# TASK 3.3: Тексты бота вынесены в конфиг
# Поддерживает подстановку переменных:
#   {organization_name} - название организации
#   {first_name} - имя пользователя
#   {user_id} - ID пользователя в Telegram
#   {group} - название группы пользователя

# Основные сообщения
main:
  welcome: |
    Привет, {first_name}! 👋
    
    Добро пожаловать в {organization_name}! Я ваш AI-ассистент.
    
    Я могу помочь тебе:
    • 📚 Учиться с помощью контекстного AI-репетитора
    • 📅 Планировать свои занятия
    • 📖 Использовать справочник знаний
    
    Используй /help для списка команд.
  
  help: |
    📋 Доступные команды {organization_name}:
    
    👤 Основные:
    /start - Начать работу с ботом
    /help - Показать это сообщение
    /status - Показать твою информацию (включая User ID)
    
    📅 Расписание:
    /schedule - Показать твое расписание на неделю
    /today - Занятия на сегодня
    
    🤖 AI-репетитор:
    Просто напиши мне вопрос или задачу, и я помогу тебе!
    
    Нужна помощь? Обратись в {support_contact}
  
  status: |
    👤 Твоя информация (User ID: {user_id}):
    
    Группа: {group}
    Организация: {organization_name}
    
    Если информация неправильная, обратись к администратору.
  
  error_unknown: "❌ Не понял запрос. Нажмите /help для списка команд."
  
  error_no_group: "⚠️ Твоя группа ещё не назначена администратором. Обратись к администратору или напиши на {support_contact}."
  
  error_class_removed: |
    ℹ️ В {organization_name} нет «классов» — используется «группа», которую назначает администратор.
    
    Если у тебя не отображается расписание, обратись к администратору.

# Сообщения расписания
schedule:
  today: "📅 Твои занятия на сегодня ({date}):"
  today_empty: "📭 На сегодня не запланировано занятий."
  
  week: "📅 Твоё расписание на неделю ({start_date} - {end_date}):"
  week_empty: "📭 На эту неделю не запланировано занятий."
  
  no_access: "❌ У тебя нет доступа к расписанию. Обратись к администратору."
  
  event_format: "🕐 {time} - {subject}\n📍 {location}\n👨‍🏫 {teacher}"

# Сообщения AI-репетитора
tutor:
  thinking: "🤔 Думаю над ответом..."
  error_no_ai: |
    ❌ AI-репетитор сейчас недоступен.
    
    Попробуйте позже или обратитесь к администратору.
  
  error_retry: "🔄 Попытка подключиться к AI через {seconds} секунд..."
  
  context_note: "📚 Я помню последние {messages} твои сообщения."

  quick_questions_prompt: "Выбери быстрый вопрос или напиши свой:"

  # Запросы при нажатии быстрых кнопок (5.2)
  quick_explain_prompt: "📝 Напиши тему, которую хочешь разобрать:"
  quick_example_prompt: "💡 По какой теме нужен пример?"
  quick_check_prompt: "✅ Напиши или опиши своё решение для проверки:"

  # Ответы на оценку AI (5.2)
  rating_understood: "✅ Отлично, рад помочь! Задавай следующий вопрос."
  rating_not_understood: "🔄 Не беда! Попробуй переформулировать вопрос или уточни — разберёмся вместе."

# Кнопки
buttons:
  menu: "📋 Меню"
  help: "❓ Помощь"
  schedule: "📅 Расписание"
  today: "📆 Сегодня"
  tutor: "🤖 AI-репетитор"
  reference: "📖 Справочник"
  contact: "📞 Контакты"
  back: "🔙 Назад"
  
  # Быстрые вопросы
  explain_topic: "📝 Объясни тему"
  give_example: "💡 Дай пример"
  check_solution: "✅ Проверь решение"
  
  # Оценка ответов
  understood: "✅ Понял"
  not_understood: "❌ Не понял"
  
  # Администрирование
  confirm: "✅ Подтвердить"
  cancel: "❌ Отменить"
  import: "📥 Импорт"
  export: "📤 Экспорт"

# Сообщения администратора
admin:
  bulk_action_confirm: |
    ⚠️ Вы собираетесь выполнить действие в отношении {count} записей.
    
    Действие: {action}
    
    ✅ Подтвердить?
  
  import_started: "📥 Начало импорта данных..."
  import_success: "✅ Импорт завершён!\n📊 Загружено записей: {count}"
  import_error: "❌ Ошибка при импорте: {error}"
  
  export_started: "📤 Подготовка данных для экспорта..."
  export_success: "✅ Экспорт завершён! Файл: {filename}"
  export_error: "❌ Ошибка при экспорте: {error}"
  
  backup_created: "💾 Создана резервная копия: {filename}"
  backup_error: "❌ Ошибка при создании резервной копии: {error}"

# Аналитика
analytics:
  total_users: "👥 Всего пользователей: {count}"
  users_by_group: "📊 Пользователей по группам:"
  schedule_records: "📅 Записей расписания: {count}"
  last_sync: "🔄 Последняя синхронизация: {datetime}"
  
  activity_title: "📈 Активность за период {start_date} - {end_date}:"
  activity_messages: "💬 Сообщений: {count}"
  activity_queries: "🤖 Запросов к AI: {count}"

# Сообщения об ошибках системы
errors:
  db_connection: "❌ Ошибка подключения к базе данных. Повторите попытку позже."
  ai_provider_error: "❌ Ошибка провайдера AI: {error}"
  timeout: "⏱️ Истёк таймаут. Повторите попытку."
  validation_error: "❌ Ошибка валидации: {error}"
  permission_denied: "🔒 У вас нет прав для этого действия."

# Сообщения миграции и обновления
system:
  startup: "🚀 Бот запущен ({timestamp})"
  config_loaded: "⚙️ Конфиг организации загружен: {organization_name}"
  db_initialized: "🗄️ База данных инициализована"
  groups_loaded: "📋 Загружено групп: {count}"
  
  maintenance_start: "🔧 Начиналось техническое обслуживание. Бот вернётся вскоре."
  maintenance_end: "✅ Техническое обслуживание завершено."
  
  version: "ℹ️ Версия бота: {version}\nВерсия конфига: {config_version}"
